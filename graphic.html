<!DOCTYPE html>
<html class="light" lang="ru">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#faf9f6"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png"/>
<link rel="apple-touch-icon" href="icons/icon-512.png"/>
<link href="https://fonts.googleapis.com/css2?family=Gloock:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
<script>
window.tailwind = window.tailwind || {}; window.tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#5d5a81", "on-primary": "#ffffff", "primary-container": "#9a97c1", "on-primary-container": "#312f53",
        secondary: "#536252", tertiary: "#745a2f", surface: "#faf9f6", "surface-dim": "#dbdad7",
        "surface-container": "#efeeeb", "surface-container-low": "#f4f3f1", "surface-container-high": "#e9e8e5",
        "on-surface": "#1a1c1a", "on-surface-variant": "#47464e", outline: "#78767f", "outline-variant": "#c8c5cf",
        "secondary-container": "#d3e4d0", error: "#ba1a1a", background: "#faf9f6", "on-background": "#1a1c1a",
      },
      fontFamily: { heading: ["Gloock", "serif"], body: ["Inter", "sans-serif"] },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
      spacing: { gutter: "16px", "section-gap": "48px", "container-margin-mobile": "20px", "container-margin-desktop": "64px" },
    },
  },
};
</script>
<style>
.material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
body { min-height: 100dvh; font-family: Inter, sans-serif; margin: 0; background: #faf9f6; }
h1, h2, h3, h4 { font-family: Gloock, serif; }
#menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,28,26,0.4); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
#menu-overlay.open { opacity: 1; pointer-events: auto; }
#menu-drawer { position: fixed; top: 0; left: 0; width: 280px; height: 100%; z-index: 70; background: #faf9f6; transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(26,28,26,0.12); }
#menu-drawer.open { transform: translateX(0); }
.drawer-item { transition: transform 160ms ease-out; }
.drawer-item:active { transform: scale(0.97); }
.btn { transition: transform 160ms ease-out; }
.btn:active { transform: scale(0.97); }
.card { transition: transform 200ms ease-out, box-shadow 200ms ease-out; }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px -4px rgba(93,90,129,0.12); }
.card:active { transform: scale(0.98); }
@media (prefers-reduced-motion: reduce) { .card:hover { transform: none; } }
</style>
</head>
<body class="text-on-surface">

<div id="menu-overlay" onclick="toggleMenu()"></div>
<div id="menu-drawer">
  <div class="flex items-center gap-4 px-6 h-16 border-b border-outline-variant/30">
    <h2 class="text-xl text-primary tracking-tight">Plein air</h2>
  </div>
  <nav class="flex-1 py-4">
    <button onclick="navTo('index.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface-variant hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-on-surface-variant">palette</span>
      <span class="font-label-caps text-label-caps">Галерея</span>
    </button>
    <button onclick="navTo('archive.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface-variant hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-on-surface-variant">folder_open</span>
      <span class="font-label-caps text-label-caps">Архив</span>
    </button>
    <button onclick="navTo('oil.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface-variant hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-on-surface-variant">brush</span>
      <span class="font-label-caps text-label-caps">Живопись</span>
    </button>
    <button onclick="navTo('graphic.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-primary" style="font-variation-settings:'FILL'1;">draw</span>
      <span class="font-label-caps text-label-caps">Графика</span>
    </button>
    <button onclick="navTo('map.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface-variant hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-on-surface-variant">map</span>
      <span class="font-label-caps text-label-caps">Карта</span>
    </button>
    <hr class="mx-6 my-2 border-outline-variant/30"/>
    <button onclick="navTo('admin.html')" class="drawer-item flex items-center gap-4 px-6 py-4 text-on-surface-variant hover:bg-primary-container/20 transition-colors border-0 bg-transparent w-full text-left cursor-pointer">
      <span class="material-symbols-outlined text-on-surface-variant">settings</span>
      <span class="font-label-caps text-label-caps">Админка</span>
    </button>
  </nav>
  <div class="px-6 py-4 border-t border-outline-variant/30">
    <div style="font-family:Gloock,serif;font-size:13px;color:#5d5a81;">Plein air</div>
    <div class="text-xs text-on-surface-variant/60">Plein air v1.0</div>
  </div>
</div>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin-mobile h-16 bg-surface/80 backdrop-blur-md shadow-sm shadow-primary/10">
  <div class="flex items-center gap-4">
    <button onclick="toggleMenu()" class="text-primary border-0 bg-transparent cursor-pointer">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <h1 class="text-2xl text-primary tracking-tight">Графика</h1>
  </div>
  <div class="flex items-center gap-3">
    <button onclick="navTo('admin.html')" class="btn text-xs font-semibold tracking-widest uppercase text-on-surface-variant border-0 bg-transparent cursor-pointer flex items-center gap-1 hover:text-primary">
      <span class="material-symbols-outlined text-base">add_circle</span>
      Добавить
    </button>
    <button id="auth-btn" onclick="toggleAuth()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary-container/20 overflow-hidden border border-primary/10 hover:bg-primary-container/40 transition-colors cursor-pointer">
      <span id="auth-icon" class="material-symbols-outlined text-primary text-lg">person</span>
      <span id="auth-label" class="text-xs font-semibold tracking-widest text-primary hidden md:inline uppercase">Log in</span>
    </button>
  </div>
</header>

<main class="pt-24 pb-28 px-container-margin-mobile md:px-container-margin-desktop max-w-[1440px] mx-auto">
  <section class="mb-section-gap">
    <div class="border-l-4 border-tertiary pl-5 py-2 mb-8">
      <h2 class="text-2xl md:text-3xl text-primary">Графические работы</h2>
      <p class="text-sm text-on-surface-variant mt-1">Карандаш, уголь, тушь, пастель</p>
    </div>
    <div id="works-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
    </div>
  </section>
</main>

<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe h-20 bg-surface/90 backdrop-blur-lg shadow-[0_-4px_24px_-2px_rgba(154,151,193,0.15)] rounded-t-xl">
  <button onclick="navTo('index.html')" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity border-0 cursor-pointer bg-transparent">
    <span class="material-symbols-outlined">palette</span>
    <span class="text-[10px] font-semibold tracking-widest uppercase mt-0.5">Галерея</span>
  </button>
  <button onclick="navTo('archive.html')" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity border-0 cursor-pointer bg-transparent">
    <span class="material-symbols-outlined">folder_open</span>
    <span class="text-[10px] font-semibold tracking-widest uppercase mt-0.5">Архив</span>
  </button>
  <button onclick="navTo('oil.html')" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity border-0 cursor-pointer bg-transparent">
    <span class="material-symbols-outlined">brush</span>
    <span class="text-[10px] font-semibold tracking-widest uppercase mt-0.5">Живопись</span>
  </button>
  <button onclick="navTo('graphic.html')" class="flex flex-col items-center justify-center bg-primary-container/30 text-on-primary-container rounded-full px-4 py-1 scale-90 border-0 cursor-pointer">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL'1;">draw</span>
    <span class="text-[10px] font-semibold tracking-widest uppercase mt-0.5">Графика</span>
  </button>
  <button onclick="navTo('map.html')" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-opacity border-0 cursor-pointer bg-transparent">
    <span class="material-symbols-outlined">map</span>
    <span class="text-[10px] font-semibold tracking-widest uppercase mt-0.5">Карта</span>
  </button>
</nav>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(r) { r.forEach(function(reg) { reg.unregister(); }); });
  navigator.serviceWorker.register('service-worker.js');
}
function navTo(page) { closeMenu(); location.href = page; }
function toggleMenu() {
  document.getElementById('menu-overlay').classList.toggle('open');
  document.getElementById('menu-drawer').classList.toggle('open');
}
function closeMenu() {
  document.getElementById('menu-overlay').classList.remove('open');
  document.getElementById('menu-drawer').classList.remove('open');
}
function toggleAuth() {
  if (localStorage.getItem('plener_activated')) {
    location.href = 'admin.html';
  } else {
    location.href = 'activation.html';
  }
}
// Auth check — как на главной
if (localStorage.getItem('plener_activated')) {
  var btn = document.getElementById('auth-btn');
  var icon = document.getElementById('auth-icon');
  var label = document.getElementById('auth-label');
  btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-secondary/15 overflow-hidden border-2 border-secondary hover:bg-secondary/25 transition-colors cursor-pointer';
  icon.className = 'material-symbols-outlined text-secondary text-lg';
  icon.textContent = 'verified';
  label.textContent = localStorage.getItem('plener_artist') || 'Admin';
  label.className = 'text-xs font-semibold tracking-widest text-secondary hidden md:inline uppercase';
}
(function(){
  var grid = document.getElementById('works-grid');
  var works = [];
  try { works = JSON.parse(localStorage.getItem('plener_works') || '[]'); } catch(e){}
  var cat = 'Графика';
  works = works.filter(function(w){ return w.category === cat; });
  if (works.length === 0) {
    grid.innerHTML = '<div class="col-span-full flex flex-col items-center justify-center py-16 text-on-surface-variant/50"><span class="material-symbols-outlined text-5xl mb-4">draw</span><p class="text-sm">Нет работ в этой категории</p></div>';
    return;
  }
  var points = [];
  try { points = JSON.parse(localStorage.getItem('plener_points') || '[]'); } catch(e){}
  var pointMap = {};
  points.forEach(function(p){ pointMap[p.id] = p; });
  function catColor(cat) {
    if (cat === 'Графика') return '#745a2f';
    if (cat === 'Этюд') return '#536252';
    return '#5d5a81';
  }
  works.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  works.forEach(function(w){
    var card = document.createElement('div');
    card.className = 'card rounded-xl overflow-hidden bg-surface-container-low cursor-pointer';
    card.setAttribute('data-work-id', w.id);
    var imgHtml = w.photo
      ? '<div class="aspect-[4/3] overflow-hidden"><img src="'+w.photo+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy"/></div>'
      : '<div class="aspect-[4/3] bg-surface-container flex items-center justify-center"><span class="material-symbols-outlined text-3xl text-on-surface-variant/30">add_photo_alternate</span></div>';
    var yearHtml = w.date ? '<span class="text-[10px] tracking-widest text-on-surface-variant/60 uppercase font-semibold">'+w.date.slice(0,4)+'</span>' : '';
    card.innerHTML = imgHtml + '<div class="p-3"><h3 class="text-sm font-semibold text-on-surface">'+escapeHtml(w.title||'Без названия')+'</h3>'+yearHtml+'</div>';
    var bottomEl = card.querySelector('.p-3');
    if (w.pointId && pointMap[w.pointId]) {
      var pt = pointMap[w.pointId];
      var chip = document.createElement('div');
      chip.style.cssText = 'display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 10px;border-radius:20px;border:1px solid #c8c5cf;cursor:pointer;font-size:11px;transition:background 0.15s;';
      chip.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:'+catColor(pt.category)+';flex-shrink:0;"></span>'
                     + '<span style="color:#5d5a81;font-weight:500;">'+escapeHtml(pt.title||'Пленэр')+'</span>'
                     + (pt.date ? '<span style="color:#47464e;">'+pt.date.slice(0,4)+'</span>' : '');
      chip.addEventListener('click', function(e){
        e.stopPropagation();
        location.href = 'map.html';
      });
      bottomEl.appendChild(chip);
    }
    card.addEventListener('click', function(){ openWorkModal(w.id); });
    grid.appendChild(card);
  });
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Modal
  var modal = document.createElement('div');
  modal.id = 'work-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(26,28,26,0.5);display:none;align-items:center;justify-content:center;padding:20px;';
  modal.addEventListener('click', function(e){ if (e.target === modal) closeWorkModal(); });
  modal.innerHTML = '<div style="background:#faf9f6;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:0;" id="modal-body"></div>';
  document.body.appendChild(modal);
  window.openWorkModal = function(id){
    var all = [];
    try { all = JSON.parse(localStorage.getItem('plener_works') || '[]'); } catch(e){}
    var w = null;
    for (var i = 0; i < all.length; i++) { if (all[i].id === id) { w = all[i]; break; } }
    if (!w) return;
    var pts = [];
    try { pts = JSON.parse(localStorage.getItem('plener_points') || '[]'); } catch(e){}
    var pm = {}; pts.forEach(function(p){ pm[p.id] = p; });
    var pt = w.pointId && pm[w.pointId] ? pm[w.pointId] : null;
    var html = '<div style="position:relative;">';
    if (w.photo) {
      html += '<img src="'+w.photo+'" style="width:100%;max-height:320px;object-fit:cover;display:block;"/>';
    }
    html += '<button onclick="closeWorkModal()" style="position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(26,28,26,0.5);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;">✕</button>';
    html += '</div>';
    html += '<div style="padding:20px;">';
    html += '<h3 style="font-family:Gloock,serif;font-size:1.2rem;color:#1a1c1a;margin:0 0 4px;">'+escapeHtml(w.title||'Без названия')+'</h3>';
    if (w.date) html += '<p style="font-size:12px;color:#47464e;margin:0 0 8px;">'+w.date.slice(0,4)+' &bull; '+escapeHtml(w.category||'')+'</p>';
    if (w.notes) html += '<p style="font-size:13px;color:#47464e;margin:0 0 12px;line-height:1.4;">'+escapeHtml(w.notes)+'</p>';
    if (pt) {
      var cc = '#5d5a81';
      if (pt.category === 'Графика') cc = '#745a2f';
      else if (pt.category === 'Этюд') cc = '#536252';
      html += '<div style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;border:1px solid #c8c5cf;font-size:11px;margin-bottom:16px;">'
           + '<span style="width:8px;height:8px;border-radius:50%;background:'+cc+';flex-shrink:0;"></span>'
           + '<span style="color:#5d5a81;font-weight:500;">'+escapeHtml(pt.title||'Пленэр')+'</span>'
           + (pt.date ? '<span style="color:#47464e;">'+pt.date.slice(0,4)+'</span>' : '')
           + '</div>';
    }
    html += '<div style="display:flex;gap:10px;">';
    html += '<button onclick="editWork(\''+w.id+'\')" style="flex:1;padding:10px;border:none;border-radius:10px;background:#5d5a81;color:#fff;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;">Редактировать</button>';
    html += '<button onclick="deleteWork(\''+w.id+'\')" style="flex:1;padding:10px;border:none;border-radius:10px;background:#ba1a1a;color:#fff;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.05em;text-transform:uppercase;">Удалить</button>';
    html += '</div></div>';
    document.getElementById('modal-body').innerHTML = html;
    modal.style.display = 'flex';
  };
  window.closeWorkModal = function(){ modal.style.display = 'none'; };
  window.deleteWork = function(id){
    if (!confirm('Удалить эту работу?')) return;
    var all = [];
    try { all = JSON.parse(localStorage.getItem('plener_works') || '[]'); } catch(e){}
    all = all.filter(function(x){ return x.id !== id; });
    localStorage.setItem('plener_works', JSON.stringify(all));
    closeWorkModal();
    location.reload();
  };
  window.editWork = function(id){
    location.href = 'admin.html?edit='+id;
  };
})();
</script>
</body>
</html>
